<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">Expense Tracker</h1>
    <div class="card p-3 mb-4 shadow">
      <form id="expense-form" class="row g-3">
        <div class="col-md-4">
          <input type="text" id="expense-name" class="form-control" placeholder="Expense Name" required />
        </div>
        <div class="col-md-4">
          <input type="number" id="expense-amount" class="form-control" placeholder="Amount" required />
        </div>
        <div class="col-md-4">
          <button type="submit" class="btn btn-primary w-100">Add Expense</button>
        </div>
      </form>
    </div>

    <table class="table table-striped table-hover shadow">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Expense Name</th>
          <th>Amount</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="expense-list"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
